<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小蜜丰 - Apple 風格數位集章卡生成器</title>
    <style>
    :root{
        --bg:#f5f7fb;
        --card:rgba(255,255,255,.88);
        --text:#17181c;
        --muted:#8b9099;
        --line:#e7e9ee;
        --blue:#0a84ff;
        --blue-dark:#006fe6;
        --shadow:0 18px 50px rgba(31,38,55,.10);
    }
    *{
        box-sizing:border-box;
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
        "PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
        -webkit-font-smoothing:antialiased;
    }
    body{
        min-height:100vh;
        margin:0;
        padding:28px 16px 42px;
        color:var(--text);
        background:
            radial-gradient(circle at 15% 0%,rgba(10,132,255,.09),transparent 34%),
            radial-gradient(circle at 90% 20%,rgba(255,149,0,.08),transparent 30%),
            var(--bg);
    }
    .page{
        width:min(1080px,100%);
        margin:auto;
        display:grid;
        grid-template-columns:minmax(320px,420px) minmax(320px,500px);
        gap:28px;
        align-items:start;
        justify-content:center;
    }
    .apple-card{
        width:100%;
        padding:28px;
        border:1px solid rgba(255,255,255,.9);
        border-radius:28px;
        background:var(--card);
        backdrop-filter:blur(24px);
        -webkit-backdrop-filter:blur(24px);
        box-shadow:var(--shadow);
    }
    .brand{
        display:flex;
        align-items:center;
        gap:12px;
        margin-bottom:24px;
    }
    .brand-icon{
        width:48px;height:48px;
        display:grid;place-items:center;
        border-radius:15px;
        background:linear-gradient(145deg,#fff4bf,#ffd95a);
        box-shadow:0 8px 18px rgba(255,193,7,.20);
        font-size:25px;
    }
    .brand h1{
        margin:0;
        font-size:22px;
        line-height:1.15;
        letter-spacing:-.6px;
    }
    .brand p{
        margin:5px 0 0;
        color:var(--muted);
        font-size:13px;
    }
    .form-group{margin:0 0 20px;}
    label{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin:0 0 9px 3px;
        color:#626873;
        font-size:13px;
        font-weight:650;
        letter-spacing:.1px;
    }
    .field{
        position:relative;
    }
    input,select{
        width:100%;
        height:52px;
        padding:0 18px;
        border:1px solid var(--line);
        border-radius:16px;
        outline:none;
        background:#f8f9fb;
        color:var(--text);
        font-size:16px;
        transition:.2s ease;
        appearance:none;
        -webkit-appearance:none;
    }
    input::placeholder{color:#b1b5bd}
    input:hover,select:hover{background:#fff;border-color:#d9dde5}
    input:focus,select:focus{
        background:#fff;
        border-color:rgba(10,132,255,.55);
        box-shadow:0 0 0 4px rgba(10,132,255,.11);
    }
    .select-arrow{
        position:absolute;
        right:18px;top:50%;
        width:9px;height:9px;
        border-right:2px solid #8b9099;
        border-bottom:2px solid #8b9099;
        transform:translateY(-65%) rotate(45deg);
        pointer-events:none;
    }
    .hint{
        margin:8px 3px 0;
        color:#9a9ea6;
        font-size:12px;
    }
    button{
        width:100%;
        min-height:54px;
        margin-top:2px;
        border:0;
        border-radius:16px;
        background:linear-gradient(180deg,#1590ff,#0879ed);
        color:#fff;
        font-size:16px;
        font-weight:700;
        letter-spacing:.1px;
        cursor:pointer;
        box-shadow:0 10px 22px rgba(10,132,255,.22);
        transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
    }
    button:hover{
        filter:brightness(1.03);
        box-shadow:0 13px 26px rgba(10,132,255,.26);
    }
    button:active{transform:scale(.98);box-shadow:0 6px 14px rgba(10,132,255,.18)}
    .preview{
        width:100%;
        padding:22px;
        border-radius:28px;
        background:rgba(255,255,255,.68);
        border:1px solid rgba(255,255,255,.9);
        box-shadow:var(--shadow);
    }
    .preview-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin:0 2px 14px;
    }
    .preview-head strong{font-size:15px}
    .preview-head span{font-size:12px;color:#989da6}
    canvas{
        display:block;
        width:100%;
        max-width:500px;
        height:auto;
        margin:auto;
        border-radius:24px;
        box-shadow:0 18px 42px rgba(25,31,44,.14);
        background:#fff;
    }
    .tip{
        margin:14px 3px 0;
        color:#9a9ea6;
        font-size:12px;
        line-height:1.6;
        text-align:center;
    }
    @media(max-width:820px){
        body{padding-top:16px}
        .page{grid-template-columns:1fr;max-width:520px;gap:18px}
        .apple-card{padding:24px}
        .preview{padding:16px}
    }
    @media(max-width:430px){
        .apple-card{padding:20px;border-radius:24px}
        .preview{padding:12px;border-radius:24px}
        .brand{margin-bottom:20px}
        .brand-icon{width:44px;height:44px}
        .brand h1{font-size:20px}
        canvas{border-radius:20px}
    }
</style>
</head>
<body>

<div class="page">
    <section class="apple-card">
        <div class="brand">
            <div class="brand-icon">🐝</div>
            <div>
                <h1>小蜜丰集章卡</h1>
                <p>數位集章卡圖片生成器</p>
            </div>
        </div>

        <div class="form-group">
            <label for="custName">顧客稱呼 / 備註</label>
            <div class="field">
                <input type="text" id="custName" value="王大哥 (123)" placeholder="例如：王大哥 (123)" oninput="drawCard()">
            </div>
        </div>

        <div class="form-group">
            <label for="stampCount">目前蓋章進度</label>
            <div class="field">
                <select id="stampCount" onchange="drawCard()">
                    <option value="0">0 章</option>
                    <option value="1">1 章</option>
                    <option value="2">2 章</option>
                    <option value="3">3 章（滿額：加購鎮內 1 店免運）</option>
                    <option value="4">4 章</option>
                    <option value="5">5 章</option>
                    <option value="6">6 章（滿額：運費現折 $20）</option>
                    <option value="7">7 章</option>
                    <option value="8">8 章</option>
                    <option value="9">9 章（滿額：外送費折$50）</option>
                </select>
                <span class="select-arrow"></span>
            </div>
            <div class="hint">修改內容後，右側集章卡會即時更新</div>
        </div>

        <button type="button" onclick="downloadCard()">📥 下載集章卡圖片</button>
    </section>

    <section class="preview">
        <div class="preview-head">
            <strong>集章卡預覽</strong>
            <span>即時更新</span>
        </div>
        <canvas id="cardCanvas" width="500" height="630"></canvas>
        <div class="tip">完成後即可下載 PNG 圖片，方便直接傳送給顧客。</div>
    </section>
</div>

<script>
function drawCard() {
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    const name = document.getElementById('custName').value || '貴賓';
    const count = parseInt(document.getElementById('stampCount').value);

    // 1. Apple 極簡底色與漸層背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 500, 630);
    
    // 細緻圓角灰框
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#f2f2f7';
    ctx.strokeRect(10, 10, 480, 610);

    // 2. Header 文字 (iOS SF 質感)
    ctx.fillStyle = '#15171b';
    ctx.font = '700 25px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🐝 小蜜丰集章卡', 250, 52);

    ctx.fillStyle = '#66707d';
    ctx.font = '600 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
    ctx.fillText(`專屬顧客　${name}`, 250, 82);

    // Header 分隔線
    ctx.strokeStyle = '#eef0f3';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(55, 102);
    ctx.lineTo(445, 102);
    ctx.stroke();

    // 3. 繪製 3x3 正圓形九宮格
    const rewards = { 3: '加購鎮內1店免運', 6: '外送費折$20', 9: '外送費折$50' };
    let stampIndex = 1;

    for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
            let x = 75 + col * 135;
            let y = 125 + row * 135;

            // 外層正圓形
            ctx.beginPath();
            ctx.arc(x + 40, y + 40, 42, 0, Math.PI * 2);
            ctx.fillStyle = (stampIndex <= count) ? '#f5faff' : '#f8f9fb';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = (stampIndex <= count) ? '#0a84ff' : '#e3e6eb';
            ctx.stroke();

            // 印章圖樣 / 數字
            if (stampIndex <= count) {
                // 已蓋章：雙圈印章效果
                ctx.beginPath();
                ctx.arc(x + 40, y + 40, 34, 0, Math.PI * 2);
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#ff3b30';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x + 40, y + 40, 27, 0, Math.PI * 2);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255,59,48,.45)';
                ctx.stroke();

                ctx.fillStyle = '#ff3b30';
                ctx.font = '700 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
                ctx.fillText('★ 蓋章', x + 40, y + 46);
            } else {
                ctx.fillStyle = '#8e8e93';
                ctx.font = '600 22px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
                ctx.fillText(stampIndex, x + 40, y + 47);
            }

            // 獎勵標記 (3, 6, 9)
            if (rewards[stampIndex]) {
                ctx.fillStyle = '#ff9500';
                ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
                ctx.fillText(`🎁${rewards[stampIndex]}`, x + 40, y + 96);
            }

            stampIndex++;
        }
    }

    // 4. 底部 Apple 經典次要資訊文字
    ctx.fillStyle = '#7b818b';
    ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
    ctx.fillText('📍 加購免運商家僅限鎮內商家', 250, 555);
    ctx.fillStyle = '#9a9ea6';
    ctx.fillText('⚠️ 本集章活動優惠僅限當月兌換使用', 250, 580);
}

function downloadCard() {
    const canvas = document.getElementById('cardCanvas');
    const name = document.getElementById('custName').value || '顧客';
    const link = document.createElement('a');
    link.download = `${name}_小蜜丰集章卡.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

drawCard();
</script>

</body>
</html>
